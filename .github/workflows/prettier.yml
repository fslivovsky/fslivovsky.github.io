name: Prettier code formatter

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v7
      - name: Install Prettier 💾
        # `npm ci` installs the exact versions in package-lock.json. Installing
        # prettier@latest instead means the formatting rules drift underneath
        # the repo and the check fails on files nobody touched.
        run: npm ci
      - name: Prettier Check 🔎
        run: npx prettier . --check
